name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  kill-switch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kill-switch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kill-switch/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin manifests and skills
        run: |
          for f in .claude-plugin/marketplace.json plugins/rollout-links/.claude-plugin/plugin.json plugins/rollout-links/.mcp.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"
          done
          for s in plugins/rollout-links/skills/*/SKILL.md; do
            head -1 "$s" | grep -q '^---$' && grep -q '^name: ' "$s" && grep -q '^description: ' "$s" && echo "ok $s"
          done
